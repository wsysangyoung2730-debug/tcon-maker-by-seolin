<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>TCON App Store 디자인 원본</title>
<style>

*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#eef1fc;font-family:'Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}
.artboard{position:relative;overflow:hidden;background:#f5f7fd;color:#172450;transform-origin:top left}
.artboard.dark{background:#1b34a8;color:#fff}
.wash{position:absolute;inset:0;background:radial-gradient(ellipse at 100% 60%,#e3e8fd 0,transparent 54%);pointer-events:none}
.dark .wash{background:radial-gradient(ellipse at 100% 58%,#6071c2 0,transparent 60%)}
.crop-mark{position:absolute;right:-100px;top:100px;width:380px;height:380px;border-top:22px solid #dce3fc;border-right:22px solid #dce3fc;transform:rotate(16deg);border-radius:12px;opacity:.35}
.dark .crop-mark{border-color:#6071c2;opacity:.16}
h1{position:absolute;top:124px;left:72px;margin:0;font-size:82px;line-height:1.15;font-weight:800;letter-spacing:-3.8px;white-space:pre-line}
.description{position:absolute;left:78px;top:347px;font-size:31px;line-height:1.5;font-weight:400;letter-spacing:-.65px;white-space:pre-line;color:#65708c;margin:0}
.dark .description{color:#d7dfff}
/* Thin, uniform bezel. The island sits in the display safe area, not in a thick top bezel. */
.frame{position:absolute;padding:12px;border-radius:81px;background:#17191e;box-shadow:0 36px 75px #1426532d,0 0 0 2px #9498a1,0 0 0 5px #575b64,inset 0 0 0 2px #050609}
.dark .frame{box-shadow:0 40px 90px #070c3048,0 0 0 2px #7b8295,0 0 0 5px #454d62,inset 0 0 0 2px #050609}
.screen{position:relative;overflow:hidden;border-radius:69px;background:#fff}
.capture-viewport{position:absolute;inset:0;overflow:hidden;width:100%;height:100%}
.status-cover{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none}
.screen img{position:absolute;display:block;max-width:none}
.screen:before{content:'';position:absolute;z-index:3;top:20px;left:50%;transform:translateX(-50%);width:224px;height:62px;border-radius:40px;background:#050506;box-shadow:inset 0 0 0 1px #111217}
.screen:after{display:none}
.side-key{position:absolute;right:-8px;top:335px;width:5px;height:118px;background:#6b707c;border-radius:0 3px 3px 0}
.side-key.left{left:-8px;right:auto;top:218px;height:70px;border-radius:3px 0 0 3px;box-shadow:0 101px #6b707c}
.ipad h1{left:85px;top:114px;font-size:88px;line-height:1.12}.ipad .description{left:92px;top:344px;font-size:30px;line-height:1.45}
.ipad .crop-mark{top:90px;right:-120px;width:500px;height:500px}
.ipad .frame{padding:38px 24px 24px;border-radius:52px}.ipad .screen{border-radius:23px}
.ipad .frame:before{content:'';position:absolute;left:50%;transform:translateX(-50%);width:12px;height:12px;top:14px;background:#080b12;box-shadow:inset 0 0 0 3px #202c45;border-radius:50%}
.ipad .screen:before,.ipad .screen:after{display:none}.ipad .side-key{top:170px;height:65px;width:4px;right:-7px}.ipad .side-key.left{display:none}
.cover .crop-mark{display:none}
.cover .wash{background:radial-gradient(ellipse at 50% 49%,#253eae 0,#1b34a8 34%,#182d91 76%)}
.cover h1{left:65px;right:65px;top:16%;text-align:center;font-size:82px;line-height:1.23;letter-spacing:-3.5px}
.hero-icon{position:absolute;left:50%;top:50%;width:410px;height:410px;transform:translate(-50%,-50%);border-radius:90px;overflow:hidden;opacity:1;box-shadow:0 16px 64px #1023751a}
.hero-icon img{width:100%;height:100%;display:block}
.hero-name{position:absolute;left:0;right:0;top:calc(50% + 273px);text-align:center;font-size:60px;letter-spacing:-1.8px;font-weight:700;color:#ffffff}
.hero-detail{position:absolute;left:0;right:0;top:calc(50% + 365px);text-align:center;font-size:29px;color:#d0d9ff;letter-spacing:-.5px}
/* The original logo stays untouched; CSS blends a subdued monochrome signature into the cover. */
.cover-signature{position:absolute;bottom:122px;left:50%;transform:translateX(-50%);width:270px;height:244px;mix-blend-mode:screen;opacity:.54}
.cover-signature img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) invert(1)}
.ipad.cover h1{top:12%;font-size:100px}.ipad .hero-icon{width:410px;height:410px;border-radius:90px}
.ipad .hero-name{top:calc(50% + 260px)}.ipad .hero-detail{top:calc(50% + 350px)}
.ipad .cover-signature{bottom:105px;width:270px;height:244px}
</style>
<main class="artboard" id="artboard">
 <div class="wash"></div><div class="crop-mark"></div>
 <h1></h1><p class="description"></p>
 <div class="frame"><i class="side-key"></i><i class="side-key left"></i><div class="screen"><div class="status-cover"></div><div class="capture-viewport"><img id="capture" alt="실제 앱 화면"></div></div></div>
</main>
<script>
const slides = [
 {id:'01-cover',cover:true,dark:true,title:'사진 준비는 가볍게,\n심사에 더 집중하세요',description:'사진 선택부터 규격 맞춤, 저장까지',feature:'TCON Maker'},
 {id:'02-start',feature:'사진 준비',title:'심사 사진 준비,\n이제 간편하게',description:'사진을 고르고, 맞추고, 저장하세요.\n한 장부터 여러 장까지 한곳에서.',source:'01-home.png',dark:true},
 {id:'03-size',feature:'규격 설정',title:'원하는 규격으로\n한 번에 맞춰요',description:'TCON · 증명사진 · 여권사진 프리셋.\n크기와 저장 용량도 함께 설정해요.',source:'07-settings.png'},
 {id:'04-editor',feature:'사진 편집',title:'얼굴 위치부터\n구도까지 섬세하게',description:'안내선을 보며 여백과 얼굴 크기를 조절해요.\n배경과 밝기도 사진에 맞게 다듬어요.',source:'03-editor.png'},
 {id:'05-folders',feature:'폴더 관리',title:'심사일·수련반별로\n차곡차곡 정리해요',description:'폴더를 만들고 작업 사진을 모아보세요.\n다음 작업도 쉽게 이어갈 수 있어요.',source:'02-folders.png'},
 {id:'06-selection',feature:'여러 장 선택',title:'필요한 사진만\n골라서 한 번에',description:'사진을 길게 눌러 여러 장을 선택하세요.\n선택한 사진만 이동하거나 저장해요.',source:'05-selection.png'},
 {id:'07-export',feature:'사진 저장',title:'사진·파일·ZIP으로\n편하게 저장해요',description:'용도에 맞는 저장 방식을 고르세요.\n원본 사진은 그대로 보관해요.',source:'06-export.png',dark:true}
];
const devices={
 'iPhone-Medium-1179x2556':{width:1179,height:2556},
 'iPhone-Large-1320x2868':{width:1320,height:2868},
 'iPad-13-2064x2752':{width:2064,height:2752,ipad:true}
};
const params = new URLSearchParams(location.search),key=params.get('device')||'iPhone-Large-1320x2868';
const device=devices[key],slide=slides[Number(params.get('slide')||0)];
if(!device||!slide)throw new Error('Unknown artboard');
const baseWidth=device.ipad?1536:1080,baseHeight=device.height/device.width*baseWidth;
const board=document.querySelector('.artboard');board.classList.toggle('dark',!!slide.dark);board.classList.toggle('ipad',!!device.ipad);
Object.assign(board.style,{width:baseWidth+'px',height:baseHeight+'px',transform:`scale(${device.width/baseWidth})`});
document.body.style.width=device.width+'px';document.body.style.height=device.height+'px';
if(slide.cover){
 board.classList.add('cover');
 board.innerHTML=`<div class="wash"></div><h1></h1><div class="hero-icon"><img src="../../../TCONMaker/Resources/Assets.xcassets/TCONLogo.imageset/tcon-logo.png" alt="TCON 앱 로고"></div><div class="hero-name">TCON Maker</div><div class="hero-detail"></div><div class="cover-signature"><img src="../../../TCONMaker/Resources/Assets.xcassets/SeolinLogo.imageset/logo.png" alt="서린태권도"></div>`;
 board.querySelector('h1').textContent=slide.title;
 board.querySelector('.hero-detail').textContent=slide.description;
 window.renderSpec={device:key,width:device.width,height:device.height,slide,source:null,crop:null,baseWidth,baseHeight,slideCount:slides.length};
}else{
document.querySelector('h1').textContent=slide.title;document.querySelector('.description').textContent=slide.description;
const sourceDevice=device.ipad?'iPad-13-2064x2752':'iPhone-Large-1320x2868';
// Fill iPhone displays with the full native capture at its original aspect ratio.
// Hide only status indicators using the sampled background of that screen.
const sourceWidth=device.ipad?2064:1320;
const crop=device.ipad?{x:0,y:58,width:2064,height:2666}:{x:0,y:0,width:1320,height:2868};
const screenWidth=device.ipad?1060:800,scale=screenWidth/crop.width,screenHeight=crop.height*scale;
const padding=device.ipad?24:12,frameWidth=screenWidth+padding*2;
const frame=document.querySelector('.frame'),screen=document.querySelector('.screen'),capture=document.querySelector('#capture');
Object.assign(frame.style,{left:(baseWidth-frameWidth)/2+'px',top:490+'px'});
Object.assign(screen.style,{width:screenWidth+'px',height:screenHeight+'px'});
const statusCover=document.querySelector('.status-cover');
const statusBackground=slide.source==='07-settings.png'?'#cccccc':(slide.source==='01-home.png'?'#ffffff':'#f2f2f7');
const statusMask=device.ipad?null:{x:0,y:0,width:1320,height:180,background:statusBackground};
if(statusMask){Object.assign(statusCover.style,{height:(statusMask.height*scale)+'px',background:statusBackground});}
else{statusCover.remove();}
capture.src=`../Captures/v1.0.2/ko-KR/${sourceDevice}/${slide.source}`;
Object.assign(capture.style,{left:-crop.x*scale+'px',top:-crop.y*scale+'px',width:sourceWidth*scale+'px'});
window.renderSpec={device:key,width:device.width,height:device.height,slide,source:`Captures/v1.0.2/ko-KR/${sourceDevice}/${slide.source}`,crop,statusMask,baseWidth,baseHeight,slideCount:slides.length};
}
</script></html>
